<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <div>
        <h1>Admin Dashboard</h1>
        <span>Feedback Management</span>
    </div>

    <!-- Logout -->
    <form th:action="@{/logout}" method="post">

        <!-- CSRF Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button class="secondary" type="submit">
            Logout
        </button>

    </form>

</header>

<main class="container">

    <h2>All Customer Feedback</h2>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>User</th>
            <th>Subject</th>
            <th>Rating</th>
            <th>Feedback</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="f : ${feedbacks}">

            <td th:text="${f.id}"></td>

            <td th:text="${f.user.name + ' (' + f.user.email + ')'}"></td>

            <td th:text="${f.subject}"></td>

            <td th:text="${f.rating + '/5'}"></td>

            <td th:text="${f.message}"></td>

            <td class="actions">

                <!-- Edit -->
                <a th:href="@{/admin/feedback/{id}/edit(id=${f.id})}">
                    Edit
                </a>

                <!-- Delete -->
                <form th:action="@{/admin/feedback/{id}/delete(id=${f.id})}"
                      method="post">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button class="danger" type="submit">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        <!-- No feedback -->
        <tr th:if="${#lists.isEmpty(feedbacks)}">

            <td colspan="6">
                No feedback submitted.
            </td>

        </tr>

        </tbody>

    </table>

</main>

</body>
</html>
