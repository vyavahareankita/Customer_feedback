<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register - Customer Feedback</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="card">

    <h1>Customer Feedback</h1>

    <h2>Create Account</h2>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/register}" method="post">

        <!-- CSRF Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <label>Name</label>
        <input type="text"
               name="name"
               required
               maxlength="100">

        <label>Email</label>
        <input type="email"
               name="email"
               required
               maxlength="100">

        <label>Password</label>
        <input type="password"
               name="password"
               required
               minlength="6">

        <button type="submit">Register</button>

    </form>

    <p>
        Already registered?
        <a th:href="@{/login}">Login</a>
    </p>

</div>

</body>
</html>
