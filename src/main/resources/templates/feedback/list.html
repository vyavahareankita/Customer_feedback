<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Feedback - Customer Feedback</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <div>
        <h1>Customer Feedback</h1>

        <span th:text="'Welcome, ' + ${user.name}"></span>
    </div>

    <!-- Logout -->
    <form th:action="@{/logout}" method="post">

        <!-- CSRF Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button class="secondary" type="submit">
            Logout
        </button>

    </form>

</header>


<main class="container">

    <div class="toolbar">

        <h2>My Feedback</h2>

        <a class="button" th:href="@{/feedback/new}">
            + Add Feedback
        </a>

    </div>


    <!-- No Feedback -->
    <div th:if="${#lists.isEmpty(feedbacks)}"
         class="empty">

        You have not submitted any feedback yet.

    </div>


    <!-- Feedback List -->
    <div class="feedback"
         th:each="f : ${feedbacks}">

        <div>

            <h3 th:text="${f.subject}"></h3>

            <p th:text="${f.message}"></p>

            <div class="meta">

                Rating:

                <strong th:text="${f.rating} + ' / 5'"></strong>

                · Submitted

                <span th:text="${#temporals.format(f.createdAt, 'dd-MM-yyyy HH:mm')}">
                </span>

            </div>

        </div>


        <a th:href="@{/feedback/{id}/edit(id=${f.id})}">
            Edit
        </a>

    </div>

</main>

</body>
</html>
